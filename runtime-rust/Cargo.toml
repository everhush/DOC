[package]
name = "doc-runtime"
version = "0.1.0"
edition = "2021"
license = "CC-BY-4.0"

[lib]
name = "doc_runtime"
path = "src/lib.rs"

[[bin]]
name = "doc"
path = "src/main.rs"

[[bin]]
name = "doc-bench"
path = "src/bench.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[features]
webgpu = ["dep:wgpu", "dep:pollster", "dep:env_logger"]

[dependencies]
wgpu = { version = "24.0.3", optional = true }
pollster = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }

[[example]]
name = "webgpu_bool"
path = "examples/webgpu_bool.rs"
required-features = ["webgpu"]

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }
