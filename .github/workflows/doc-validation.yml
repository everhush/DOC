name: DOC dual-runtime validation

on:
  push:
    branches: [feat/webgpu-dual-runtime-ci]
    paths:
      - '.github/workflows/doc-validation.yml'
      - 'runtime-rust/**'
      - 'runtime-goose/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust finite DOC + WGSL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rust
      - name: Enforce native Rust and Goose runtime source policy
        run: bash runtime-goose/check-native-sources.sh
      - name: Shell syntax-check all DOC validation harnesses before compiling Goose
        run: |
          set -euo pipefail
          for script in runtime-goose/*.sh runtime-rust/*.sh; do
            bash -n "$script"
          done
      - name: Native compile, tests and WGSL parse/validation
        run: |
          set -o pipefail
          mkdir -p validation-logs
          cargo test --manifest-path runtime-rust/Cargo.toml --all-targets 2>&1 | tee validation-logs/rust-tests.log
          cargo build --manifest-path runtime-rust/Cargo.toml --release 2>&1 | tee validation-logs/rust-release.log
      - name: Run actual DOC source, check reported values
        run: |
          set -o pipefail
          DOC_WORKERS=1 cargo run --quiet --manifest-path runtime-rust/Cargo.toml --bin doc -- runtime-rust/examples/repair.doc a=4 b=1 > validation-logs/doc-worker1.txt
          DOC_WORKERS=4 cargo run --quiet --manifest-path runtime-rust/Cargo.toml --bin doc -- runtime-rust/examples/repair.doc a=4 b=1 > validation-logs/doc-worker4.txt
          diff -u validation-logs/doc-worker1.txt validation-logs/doc-worker4.txt
          grep -Fx 'a: 4' validation-logs/doc-worker1.txt
          grep -Fx 'b: 1' validation-logs/doc-worker1.txt
          grep -Fx 'sum: 5' validation-logs/doc-worker1.txt
          grep -Fx 'doubled: 10' validation-logs/doc-worker1.txt
          grep -Fx 'chosen: 10' validation-logs/doc-worker1.txt
      - name: Black-box DOC finite branch and failure conformance (1, 2, 4 workers)
        run: bash runtime-rust/check-doc-finite-cli.sh runtime-rust/target/release/doc validation-logs
      - name: Source format and lint diagnostics (record until existing sources are normalized)
        continue-on-error: true
        run: |
          cargo fmt --manifest-path runtime-rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path runtime-rust/Cargo.toml --all-targets
      - name: Package and re-execute native Rust DOC Linux binary
        run: |
          set -euo pipefail
          mkdir -p validation-logs/release/bin
          install -m 755 runtime-rust/target/release/doc validation-logs/release/bin/doc-rust
          ldd validation-logs/release/bin/doc-rust > validation-logs/rust-dynamic-dependencies.txt 2>&1 || true
          tar -czf validation-logs/doc-rust-linux-x86_64.tar.gz \
            -C validation-logs/release bin/doc-rust \
            -C "$GITHUB_WORKSPACE" LICENSE runtime-rust/examples/repair.doc
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          tar -xzf validation-logs/doc-rust-linux-x86_64.tar.gz -C "$scratch"
          "$scratch/bin/doc-rust" "$scratch/runtime-rust/examples/repair.doc" a=4 b=1 \
            > validation-logs/rust-installed-smoke.log 2>&1
          grep -Fx 'chosen: 10' validation-logs/rust-installed-smoke.log
          echo DOC_RUST_PACKAGED_INSTALL_PASS
      - name: Preserve raw outputs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-rust-validation
          path: validation-logs/
          retention-days: 7
          if-no-files-found: warn

  webgpu-compute:
    name: Native Rust wgpu DOC compute (Mesa Vulkan, no Goose bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rust
      - name: Install Mesa Vulkan for actual Rust WebGPU dispatch
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers vulkan-tools
          mkdir -p validation-logs
          vulkaninfo --summary > validation-logs/rust-adapter.log 2>&1
      - name: Rust wgpu map, staged reduction, source repair and CPU differential
        run: |
          set -euo pipefail
          cargo test --release --manifest-path runtime-rust/Cargo.toml \
            --features webgpu --example webgpu_integer_eq
          cargo build --release --manifest-path runtime-rust/Cargo.toml \
            --features webgpu --examples
          bool=runtime-rust/target/release/examples/webgpu_bool
          signed=runtime-rust/target/release/examples/webgpu_integer_eq
          "$bool" > validation-logs/rust-map.log 2>&1
          grep -F 'DOC_WEBGPU_COMPUTE_PASS:' validation-logs/rust-map.log
          DOC_GPU_REDUCTION=1 "$bool" --staged-repair \
            > validation-logs/rust-staged-reduction.log 2>&1
          test "$(grep -c '^DOC_WEBGPU_COMPUTE_PASS:' \
            validation-logs/rust-staged-reduction.log)" = 2
          test "$(grep -c '^DOC_WEBGPU_REDUCTION_PASS:' \
            validation-logs/rust-staged-reduction.log)" = 2
          for mode in eq lt le; do
            for lanes in 1 63 64 65 129 257 1024; do
              if [ "$mode" = eq ]; then
                DOC_GPU_LANES="$lanes" "$signed" \
                  > "validation-logs/rust-$mode-$lanes.log" 2>&1
              else
                DOC_GPU_LANES="$lanes" "$signed" "--$mode" \
                  > "validation-logs/rust-$mode-$lanes.log" 2>&1
              fi
              test "$(grep -c '^DOC_SIGNED_WEBGPU_COMPUTE_PASS:' \
                "validation-logs/rust-$mode-$lanes.log")" = 2
            done
          done
          if DOC_GPU_INJECT_INT_OUT_OF_RANGE=1 "$signed" \
            > validation-logs/rust-range-reject.log 2>&1; then
            echo "Rust wgpu i64 range rejection failed" >&2; exit 1
          fi
          DOC_GPU_EXECUTION=cpu DOC_GPU_REDUCTION=1 "$bool" --staged-repair \
            > validation-logs/rust-cpu-only.log 2>&1
          if grep -q '^DOC_WEBGPU_COMPUTE_PASS:' validation-logs/rust-cpu-only.log; then
            echo "Rust CPU fallback falsely claimed GPU dispatch" >&2; exit 1
          fi
          echo DOC_RUST_WGPU_INDEPENDENT_PASS
      - name: Preserve Rust-only wgpu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-rust-wgpu-validation
          path: validation-logs/
          retention-days: 14
          if-no-files-found: warn

  goose-toolchain:
    name: Goose compiler smoke and DOC Boolean slice
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned upstream Goose compiler build cache
        id: goose-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/goose
            /tmp/goose-build
          key: doc-goose-compiler-${{ runner.os }}-9412b80f52d833c4697cffdbbf1f4eeb5195cd41-release-v1
      - name: Configure upstream Goose compiler, no optional graphics packages
        if: steps.goose-cache.outputs.cache-hit != 'true'
        run: |
          git init /tmp/goose
          git -C /tmp/goose fetch --depth 1 https://github.com/aardappel/goose.git 9412b80f52d833c4697cffdbbf1f4eeb5195cd41
          git -C /tmp/goose checkout --detach FETCH_HEAD
          cmake -S /tmp/goose -B /tmp/goose-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/goose-build --parallel 2
      - name: Verify cached or newly compiled Goose executable
        run: |
          test -x /tmp/goose-build/goose
          /tmp/goose-build/goose version
      - name: Type-check and execute preliminary Goose smoke
        run: |
          set -o pipefail
          mkdir -p validation-logs
          /tmp/goose-build/goose version | tee validation-logs/goose-version.log
          /tmp/goose-build/goose check runtime-goose/finite_bool.goose 2>&1 | tee validation-logs/goose-check.log
          /tmp/goose-build/goose run runtime-goose/finite_bool.goose 2>&1 | tee validation-logs/goose-run.log
          grep -q 'DOC_GOOSE_SMOKE=ok' validation-logs/goose-run.log
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust DOC reference for cross-runtime source differential
        run: cargo build --release --manifest-path runtime-rust/Cargo.toml --bin doc
      - name: Build Rust arbitrary-precision two-counter recurrence witness
        run: cargo build --release --manifest-path runtime-rust/Cargo.toml --bin doc_counter
      - name: Validate Goose DOC and identical-source Rust/Goose differential
        run: bash runtime-goose/check-doc-bool.sh /tmp/goose-build/goose validation-logs runtime-rust/target/release/doc
      - name: Goose finite DAG incremental repair and native Rust differential
        run: bash runtime-goose/check-doc-graph.sh /tmp/goose-build/goose validation-logs runtime-rust/target/release/doc
      - name: Independent native Goose typed DOC and Rust differential
        run: bash runtime-goose/check-doc-typed.sh /tmp/goose-build/goose runtime-rust/target/release/doc validation-logs
      - name: Same-source balanced reduction with independent oracle (1, 2, 4 workers)
        run: bash runtime-goose/check-doc-reduction.sh /tmp/goose-build/goose runtime-rust/target/release/doc validation-logs
      - name: Independent Rust-Goose arbitrary-natural counter oracle
        run: bash runtime-goose/check-doc-counter.sh /tmp/goose-build/goose runtime-rust/target/release/doc_counter validation-logs
      - name: Package and re-execute native Goose DOC Linux binary
        run: |
          set -euo pipefail
          mkdir -p validation-logs/release/bin
          /tmp/goose-build/goose build runtime-goose/doc_typed.goose --offline \
            -o validation-logs/release/bin/doc-goose \
            > validation-logs/goose-packaging-build.log 2>&1
          chmod 755 validation-logs/release/bin/doc-goose
          ldd validation-logs/release/bin/doc-goose > validation-logs/goose-dynamic-dependencies.txt 2>&1 || true
          tar -czf validation-logs/doc-goose-linux-x86_64.tar.gz \
            -C validation-logs/release bin/doc-goose \
            -C "$GITHUB_WORKSPACE" LICENSE runtime-rust/examples/repair.doc
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          tar -xzf validation-logs/doc-goose-linux-x86_64.tar.gz -C "$scratch"
          "$scratch/bin/doc-goose" "$scratch/runtime-rust/examples/repair.doc" a=4 b=1 \
            > validation-logs/goose-installed-smoke.log 2>&1
          grep -Fx 'chosen: 10' validation-logs/goose-installed-smoke.log
          echo DOC_GOOSE_PACKAGED_INSTALL_PASS
      - name: Preserve Goose compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-goose-toolchain-smoke
          path: validation-logs/
          retention-days: 7
          if-no-files-found: warn


  webgpu-hardware:
    # Opt-in: configure a labelled physical-GPU self-hosted runner AND
    # repository variable DOC_ENABLE_HARDWARE_GPU=true. Never substitute
    # Mesa lavapipe, SwiftShader or CPU fallback for this required evidence.
    if: ${{ vars.DOC_ENABLE_HARDWARE_GPU == 'true' }}
    needs: goose-toolchain
    name: Hardware WebGPU DOC compute (opt-in physical GPU runner)
    runs-on: [self-hosted, Linux, doc-webgpu-hardware]
    timeout-minutes: 30
    env:
      DOC_GPU_REQUIRE_HARDWARE: "1"
      DOC_GPU_EXECUTION: gpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rust
      - name: Record real adapter and driver
        run: |
          set -euo pipefail
          mkdir -p validation-logs
          vulkaninfo --summary 2>&1 | tee validation-logs/hardware-adapter.log
      - name: Strict hardware WebGPU compute and source repair
        run: |
          set -euo pipefail
          cargo run --release --manifest-path runtime-rust/Cargo.toml \
            --features webgpu --example webgpu_bool -- --staged-repair \
            2>&1 | tee validation-logs/hardware-repair.log
          test "$(grep -c '^DOC_WEBGPU_COMPUTE_PASS:' validation-logs/hardware-repair.log)" = 2
          grep -E 'DOC_WEBGPU_ADAPTER:.*type=(IntegratedGpu|DiscreteGpu)' validation-logs/hardware-repair.log
      - name: Download independent Goose-generated signed WGSL
        uses: actions/download-artifact@v4
        with:
          name: doc-goose-webgpu-input
          path: validation-logs/goose-webgpu
      - name: Verify actual physical-GPU DOC signed equality and dependent reduction
        run: |
          set -euo pipefail
          DOC_GPU_LANES=257 cargo run --release --manifest-path runtime-rust/Cargo.toml \
            --features webgpu --example webgpu_integer_eq \
            -- --shader validation-logs/goose-webgpu/integer-equality.wgsl \
            2>&1 | tee validation-logs/hardware-signed-goose.log
          test "$(grep -c '^DOC_SIGNED_WEBGPU_COMPUTE_PASS:' validation-logs/hardware-signed-goose.log)" = 2
          grep -E 'DOC_SIGNED_WEBGPU_ADAPTER:.*type=(IntegratedGpu|DiscreteGpu)' \
            validation-logs/hardware-signed-goose.log
          DOC_GPU_LANES=256 DOC_GPU_REDUCTION=1 cargo run --release \
            --manifest-path runtime-rust/Cargo.toml --features webgpu \
            --example webgpu_bool -- --staged-shaders-repair \
            validation-logs/goose-webgpu/stage-1.wgsl \
            validation-logs/goose-webgpu/stage-2.wgsl \
            2>&1 | tee validation-logs/hardware-goose-reduction.log
          test "$(grep -c '^DOC_WEBGPU_REDUCTION_PASS:' validation-logs/hardware-goose-reduction.log)" = 2
          echo DOC_HARDWARE_SIGNED_AND_REDUCTION_PASS
      - name: Preserve physical GPU evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-physical-gpu-validation
          path: validation-logs/
          retention-days: 14
          if-no-files-found: warn

  portable-native:
    name: Native Rust and Goose DOC portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rust
      - name: Native Rust build and all-target tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path runtime-rust/Cargo.toml --all-targets
          cargo build --release --manifest-path runtime-rust/Cargo.toml --bin doc
          binary=runtime-rust/target/release/doc
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          "$binary" runtime-rust/examples/repair.doc a=4 b=1 > rust-portable.log
          grep -Fx 'chosen: 10' rust-portable.log
          echo DOC_PORTABLE_NATIVE_RUST_PASS
      - name: Restore pinned native Goose compiler toolchain
        id: goose-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/upstream-goose
            ${{ github.workspace }}/upstream-build
          key: native-goose-${{ matrix.os }}-9412b80f52d833c4697cffdbbf1f4eeb5195cd41-v2
      - name: Build pinned native Goose toolchain
        if: steps.goose-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-goose
          git -C upstream-goose fetch --depth 1 https://github.com/aardappel/goose.git 9412b80f52d833c4697cffdbbf1f4eeb5195cd41
          git -C upstream-goose checkout --detach FETCH_HEAD
          cmake -S upstream-goose -B upstream-build -DCMAKE_BUILD_TYPE=Release
          cmake --build upstream-build --config Release --parallel 2
      - name: Native Goose typed interpreter smoke
        shell: bash
        run: |
          set -euo pipefail
          goose=upstream-build/goose
          if [ "$RUNNER_OS" = Windows ]; then goose=upstream-build/Release/goose.exe; fi
          test -x "$goose"
          "$goose" check runtime-goose/doc_typed.goose
          mkdir -p portable
          artifact=portable/doc-goose
          if [ "$RUNNER_OS" = Windows ]; then artifact="$artifact.exe"; fi
          "$goose" build runtime-goose/doc_typed.goose --offline -o "$artifact"
          "$artifact" runtime-rust/examples/repair.doc a=4 b=1 > portable/goose-smoke.log
          grep -Fx 'chosen: 10' portable/goose-smoke.log
          echo DOC_PORTABLE_NATIVE_DUAL_RUNTIME_PASS
      - name: Preserve native portability evidence and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-portable-${{ matrix.os }}
          path: |
            portable/
            rust-portable.log
          if-no-files-found: warn
          retention-days: 14
