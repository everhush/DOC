name: DOC dual-runtime validation

on:
  push:
    branches: [feat/webgpu-dual-runtime-ci]
    paths:
      - '.github/workflows/doc-validation.yml'
      - 'runtime-rust/**'
      - 'runtime-goose/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Rust finite DOC + WGSL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rust
      - name: Enforce native Rust and Goose runtime source policy
        run: bash runtime-goose/check-native-sources.sh
      - name: Native compile, tests and WGSL parse/validation
        run: |
          set -o pipefail
          mkdir -p validation-logs
          cargo test --manifest-path runtime-rust/Cargo.toml --all-targets 2>&1 | tee validation-logs/rust-tests.log
          cargo build --manifest-path runtime-rust/Cargo.toml --release 2>&1 | tee validation-logs/rust-release.log
      - name: Run actual DOC source, check reported values
        run: |
          set -o pipefail
          DOC_WORKERS=1 cargo run --quiet --manifest-path runtime-rust/Cargo.toml --bin doc -- runtime-rust/examples/repair.doc a=4 b=1 > validation-logs/doc-worker1.txt
          DOC_WORKERS=4 cargo run --quiet --manifest-path runtime-rust/Cargo.toml --bin doc -- runtime-rust/examples/repair.doc a=4 b=1 > validation-logs/doc-worker4.txt
          diff -u validation-logs/doc-worker1.txt validation-logs/doc-worker4.txt
          grep -Fx 'a: 4' validation-logs/doc-worker1.txt
          grep -Fx 'b: 1' validation-logs/doc-worker1.txt
          grep -Fx 'sum: 5' validation-logs/doc-worker1.txt
          grep -Fx 'doubled: 10' validation-logs/doc-worker1.txt
          grep -Fx 'chosen: 10' validation-logs/doc-worker1.txt
      - name: Black-box DOC finite branch and failure conformance (1, 2, 4 workers)
        run: bash runtime-rust/check-doc-finite-cli.sh runtime-rust/target/release/doc validation-logs
      - name: Source format and lint diagnostics (record until existing sources are normalized)
        continue-on-error: true
        run: |
          cargo fmt --manifest-path runtime-rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path runtime-rust/Cargo.toml --all-targets
      - name: Preserve raw outputs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-rust-validation
          path: validation-logs/
          retention-days: 7
          if-no-files-found: warn

  webgpu-compute:
    needs: goose-toolchain
    name: DOC-derived WebGPU compute on Mesa lavapipe (software adapter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XDG_RUNTIME_DIR: /tmp/doc-xdg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-rust
      - name: Install Vulkan software adapter for real WebGPU dispatch
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          mkdir -p validation-logs
          install -d -m 700 "$XDG_RUNTIME_DIR"
          lavapipe_icd=$(dpkg-query -L "mesa-vulkan-drivers:$(dpkg --print-architecture)" | awk '/\/lvp_icd(\.[^/]+)?\.json$/')
          if [[ ! -f "$lavapipe_icd" ]]; then
            echo 'Expected one installed lavapipe Vulkan manifest.' >&2
            exit 1
          fi
          printf 'VK_DRIVER_FILES=%s\n' "$lavapipe_icd" | tee validation-logs/vulkan-icd.log >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$lavapipe_icd" vulkaninfo --summary 2>&1 | tee validation-logs/vulkan-adapter.log
      - name: Test WebGPU batch validation
        run: cargo test --release --manifest-path runtime-rust/Cargo.toml --features webgpu --example webgpu_bool
      - name: Compile, dispatch and compare DOC GPU vs CPU outputs
        env:
          RUST_LOG: wgpu_core=debug,wgpu_hal=debug
        run: |
          set -o pipefail
          cargo run --release --manifest-path runtime-rust/Cargo.toml --features webgpu --example webgpu_bool 2>&1 | tee validation-logs/doc-webgpu-compute.log
          grep -q DOC_WEBGPU_COMPUTE_PASS validation-logs/doc-webgpu-compute.log
      - name: Get native Goose shader and CPU oracle
        uses: actions/download-artifact@v4
        with:
          name: doc-goose-webgpu-input
          path: validation-logs/goose-webgpu
      - name: Dispatch Goose-derived WGSL and compare both native CPU results
        run: |
          set -o pipefail
          cargo run --release --manifest-path runtime-rust/Cargo.toml --features webgpu --example webgpu_bool -- --shader validation-logs/goose-webgpu/conditional.wgsl 2>&1 | tee validation-logs/doc-goose-webgpu-compute.log
          grep '^DOC_WEBGPU_COMPUTE_PASS:' validation-logs/doc-goose-webgpu-compute.log > validation-logs/doc-goose-webgpu-actual.txt
          diff -u validation-logs/goose-webgpu/expected.txt validation-logs/doc-goose-webgpu-actual.txt
      - name: Check ordered device stages from both lowerers
        run: |
          set -o pipefail
          cargo run --release --manifest-path runtime-rust/Cargo.toml --features webgpu --example webgpu_bool -- --staged 2>&1 | tee validation-logs/doc-rust-staged.log
          cargo run --release --manifest-path runtime-rust/Cargo.toml --features webgpu --example webgpu_bool -- --staged-shaders validation-logs/goose-webgpu/stage-1.wgsl validation-logs/goose-webgpu/stage-2.wgsl 2>&1 | tee validation-logs/doc-goose-staged.log
          for runtime in rust goose; do
            grep '^DOC_WEBGPU_COMPUTE_PASS:' "validation-logs/doc-${runtime}-staged.log" > "validation-logs/doc-${runtime}-staged-actual.txt"
            diff -u validation-logs/goose-webgpu/staged-expected.txt "validation-logs/doc-${runtime}-staged-actual.txt"
          done
          printf 'invalid WGSL\n' > validation-logs/invalid.wgsl
          if cargo run --release --manifest-path runtime-rust/Cargo.toml --features webgpu --example webgpu_bool -- --staged-shaders validation-logs/goose-webgpu/stage-1.wgsl validation-logs/invalid.wgsl > validation-logs/doc-invalid-staged.log 2>&1; then
            echo 'Invalid stage unexpectedly completed' >&2
            exit 1
          fi
          grep -F 'DOC WebGPU validation failure:' validation-logs/doc-invalid-staged.log
          if grep -q '^DOC_WEBGPU_COMPUTE_PASS:' validation-logs/doc-invalid-staged.log; then exit 1; fi
      - name: Preserve WebGPU adapter and correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-webgpu-lavapipe
          path: validation-logs/
          retention-days: 7
          if-no-files-found: warn

  goose-toolchain:
    name: Goose compiler smoke and DOC Boolean slice
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure upstream Goose compiler, no optional graphics packages
        run: |
          git init /tmp/goose
          git -C /tmp/goose fetch --depth 1 https://github.com/aardappel/goose.git 9412b80f52d833c4697cffdbbf1f4eeb5195cd41
          git -C /tmp/goose checkout --detach FETCH_HEAD
          cmake -S /tmp/goose -B /tmp/goose-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/goose-build --parallel 2
      - name: Type-check and execute preliminary Goose smoke
        run: |
          set -o pipefail
          mkdir -p validation-logs
          /tmp/goose-build/goose version | tee validation-logs/goose-version.log
          /tmp/goose-build/goose check runtime-goose/finite_bool.goose 2>&1 | tee validation-logs/goose-check.log
          /tmp/goose-build/goose run runtime-goose/finite_bool.goose 2>&1 | tee validation-logs/goose-run.log
          grep -q 'DOC_GOOSE_SMOKE=ok' validation-logs/goose-run.log
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust DOC reference for cross-runtime source differential
        run: cargo build --release --manifest-path runtime-rust/Cargo.toml --bin doc
      - name: Validate Goose DOC and identical-source Rust/Goose differential
        run: bash runtime-goose/check-doc-bool.sh /tmp/goose-build/goose validation-logs runtime-rust/target/release/doc
      - name: Goose finite DAG incremental repair and native Rust differential
        run: bash runtime-goose/check-doc-graph.sh /tmp/goose-build/goose validation-logs runtime-rust/target/release/doc
      - name: Independent native Goose typed DOC and Rust differential
        run: bash runtime-goose/check-doc-typed.sh /tmp/goose-build/goose runtime-rust/target/release/doc validation-logs
      - name: Same-source balanced reduction with independent oracle (1, 2, 4 workers)
        run: bash runtime-goose/check-doc-reduction.sh /tmp/goose-build/goose runtime-rust/target/release/doc validation-logs
      - name: Publish native Goose shader and CPU oracle
        uses: actions/upload-artifact@v4
        with:
          name: doc-goose-webgpu-input
          path: validation-logs/goose-webgpu/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve Goose compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-goose-toolchain-smoke
          path: validation-logs/
          retention-days: 7
          if-no-files-found: warn
