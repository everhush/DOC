name: One-time prune of superseded physical-GPU development branch

# The user requested exactly master plus feat/webgpu-dual-runtime-ci.
# This can execute when hosted GitHub runners become available.
# It NEVER rewrites the feature branch or master and only deletes an ancestor.
on:
  push:
    branches: [feat/webgpu-dual-runtime-ci]
    paths: ['.github/workflows/doc-prune-legacy-branch.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune-merged-legacy-ref:
    if: ${{ github.repository == 'x0796666-ui/DOC' && github.ref == 'refs/heads/feat/webgpu-dual-runtime-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current consolidated DOC history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed ancestor test before deleting exactly one branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          old=x-feat/physical-gpu-parity
          destination=feat/webgpu-dual-runtime-ci
          if ! git ls-remote --exit-code --heads origin "$old" >/dev/null; then
            echo "DOC_BRANCH_PRUNE_ALREADY_DONE: $old absent"
            exit 0
          fi
          git fetch --no-tags origin \
            "refs/heads/$old:refs/remotes/origin/$old" \
            "refs/heads/$destination:refs/remotes/origin/$destination"
          git merge-base --is-ancestor \
            "refs/remotes/origin/$old" \
            "refs/remotes/origin/$destination" || {
            echo "DOC_BRANCH_PRUNE_BLOCKED: legacy work not an ancestor" >&2
            exit 1
          }
          if ! git merge-base --is-ancestor origin/master "refs/remotes/origin/$destination"; then
            echo "DOC_BRANCH_PRUNE_BLOCKED: master history not consolidated" >&2
            exit 1
          fi
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$old"
          echo "DOC_LEGACY_BRANCH_PRUNED: $old"
