name: Rust DOC finite runtime
on:
  push:
    branches: [master]
    paths:
      - 'runtime-rust/**'
      - 'paper-calculus/**'
      - '.github/workflows/rust-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path runtime-rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path runtime-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path runtime-rust/Cargo.toml --all-targets
      - run: cargo test --release --manifest-path runtime-rust/Cargo.toml --all-targets
      - run: cargo run --release --manifest-path runtime-rust/Cargo.toml --bin doc -- runtime-rust/examples/repair.doc a=4 b=1
      - run: |
          DOC_WORKERS=1 cargo run --release --manifest-path runtime-rust/Cargo.toml --bin doc-bench
          DOC_WORKERS=2 cargo run --release --manifest-path runtime-rust/Cargo.toml --bin doc-bench
          DOC_WORKERS=4 cargo run --release --manifest-path runtime-rust/Cargo.toml --bin doc-bench
