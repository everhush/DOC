name: DOC Kaggle API permission diagnosis (no GPU)

# This job consumes GitHub CPU only. It never submits a notebook or creates
# a dataset. Runs on initial push and can be manually rerun after changes.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/doc-kaggle-permissions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaggle-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI for read-only API probes
        run: |
          set -euo pipefail
          # Kaggle CLI 2.2.5 imports six but omits the dependency when
          # python-dateutil >=4 is installed. This is NOT an auth failure.
          python3 -m pip install --disable-pip-version-check 'kaggle>=2.2.1,<3' 'six>=1.16'
          python3 -c "import kaggle, six; print('DOC_KAGGLE_CLI_IMPORT_PASS')"
      - name: Test exact dataset owner and token permissions without GPU spend
        env:
          KAGGLE_DOC_1: ${{ secrets.KAGGLE_DOC_1 }}
          DOC_KAGGLE_USERNAME: ${{ vars.DOC_KAGGLE_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="doc-kaggle-auth-") as td:
              env = dict(os.environ)
              token = env.pop("KAGGLE_DOC_1", "").strip()
              owner = env.get("DOC_KAGGLE_USERNAME", "").strip().lower()
              env["KAGGLE_CONFIG_DIR"] = td
              if not token:
                  raise SystemExit("DOC_KAGGLE_PERMISSION_RESULT: missing KAGGLE_DOC_1")
              if token.startswith("{"):
                  try:
                      parsed = json.loads(token)
                      expected_owner = str(parsed.get("username", "")).lower()
                      env_file = Path(td) / "kaggle.json"
                      env_file.write_text(json.dumps({"username":parsed["username"],"key":parsed["key"]}))
                      env_file.chmod(0o600)
                  except Exception:
                      raise SystemExit("DOC_KAGGLE_PERMISSION_RESULT: invalid legacy JSON secret")
                  print("DOC_KAGGLE_OWNER_MATCHES_SECRET:", owner == expected_owner)
                  if not owner:
                      owner = expected_owner
              else:
                  env["KAGGLE_API_TOKEN"] = token
              # Report credential SHAPE only, never any of its bytes.
              print("DOC_KAGGLE_SECRET_SHAPE:",
                    "legacy_json" if token.startswith("{") else "raw_token",
                    "wrapped_in_quotes=" + str(token[:1] in ("'", '"')),
                    "contains_newline=" + str(chr(10) in token),
                    "env_assignment=" + str(token.startswith("KAGGLE_API_TOKEN=")))
              # Distinguish an independently broken Kaggle CLI from a token
              # that makes the CLI fail during its own module initialization.
              baseline = dict(env)
              for setting in ("KAGGLE_API_TOKEN","KAGGLE_KEY","KAGGLE_USERNAME",
                              "KAGGLE_DOC_1"):
                  baseline.pop(setting,None)
              plain = subprocess.run(["kaggle","--version"],
                  capture_output=True,text=True,env=baseline,timeout=20)
              raw_error = plain.stdout + chr(10) + plain.stderr
              klass = re.findall(r"(?m)^([A-Za-z_][A-Za-z_0-9]*(?:Error|Exception)):",raw_error)
              print("DOC_KAGGLE_BASELINE_VERSION: ok=",
                    plain.returncode == 0,
                    "exception=" + (klass[-1] if klass else "none"))
              print("DOC_KAGGLE_OWNER_VARIABLE_PRESENT:", bool(owner))
              if not re.fullmatch(r"[a-z0-9_-]{2,60}", owner):
                  raise SystemExit("DOC_KAGGLE_PERMISSION_RESULT: invalid or absent username")
              # Do not emit raw CLI stderr/stdout: a failed auth stack may
              # contain secret-derived material. Only coarse error categories
              # are useful for deciding next steps.
              def classify(output):
                  msg = output.lower()
                  if "authentication required" in msg or "not authenticated" in msg:
                      return "AUTH_REQUIRED"
                  if "invalid token" in msg or "token is invalid" in msg or "expired token" in msg:
                      return "TOKEN_INVALID_OR_EXPIRED"
                  if "insufficient scope" in msg or "permission denied" in msg or "access denied" in msg:
                      return "PERMISSION_OR_SCOPE"
                  if "403" in msg or "forbidden" in msg:
                      return "HTTP_403_FORBIDDEN"
                  if "401" in msg or "unauthorized" in msg:
                      return "HTTP_401_UNAUTHORIZED"
                  if "429" in msg or "rate limit" in msg or "too many requests" in msg:
                      return "RATE_LIMITED"
                  if "unrecognized arguments" in msg or "no such option" in msg or "usage:" in msg:
                      return "CLI_ARGUMENT_ERROR"
                  if "connection" in msg or "timeout" in msg or "name resolution" in msg:
                      return "NETWORK_OR_TIMEOUT"
                  if "traceback" in msg or "exception" in msg:
                      return "CLI_INTERNAL_EXCEPTION"
                  return "UNCLASSIFIED"
              for label,command in [
                  ("version",["kaggle","--version"]),
                  ("configuration",["kaggle","config","view"])]:
                  try:
                      p = subprocess.run(command,capture_output=True,text=True,
                                         env=env,timeout=20)
                      msg=p.stdout + chr(10) + p.stderr
                      klass=re.findall(
                          r"(?m)^([A-Za-z_][A-Za-z_0-9]*(?:Error|Exception)):",
                          msg)
                      print(f"DOC_KAGGLE_AUTH_DIAG: {label} ok={p.returncode == 0}"
                            f" category={classify(msg) if p.returncode else 'OK'}"
                            f" exception={klass[-1] if klass else 'none'}")
                  except subprocess.TimeoutExpired:
                      print(f"DOC_KAGGLE_AUTH_DIAG: {label} category=TIMEOUT")
              probes = [
                  ("quota", ["kaggle","quota","--format","json"]),
                  ("private_list",["kaggle","datasets","list","--mine","--search","doc-gpu"]),
                  ("owner_list",["kaggle","datasets","list","--user",owner,"--search","doc-gpu"]),
                  ("private_status",["kaggle","datasets","status",owner+"/doc-gpu-44953036963-1-bundle"]),
                  ("private_files",["kaggle","datasets","files",owner+"/doc-gpu-44953036963-1-bundle"]),
                  ("notebook_list",["kaggle","kernels","list","--mine","--search","doc-gpu"]),
              ]
              statuses = {}
              for name,command in probes:
                  try:
                      p = subprocess.run(command,capture_output=True,text=True,
                                         env=env,timeout=25)
                      output=(p.stdout+"\n"+p.stderr)[-4000:]
                      http = re.search(r"(?<!\d)(401|403|404|429|500|503)(?!\d)",output)
                      statuses[name] = p.returncode == 0
                      klass = re.findall(
                          r"(?m)^([A-Za-z_][A-Za-z_0-9]*(?:Error|Exception)):",
                          output)
                      print(f"DOC_KAGGLE_PROBE: {name} success={p.returncode == 0} "
                            f"rc={p.returncode} category={classify(output)} "
                            f"exception={klass[-1] if klass else 'none'} "
                            f"http={http.group(1) if http else 'not_shown'}")
                  except subprocess.TimeoutExpired:
                      statuses[name]=False
                      print(f"DOC_KAGGLE_PROBE: {name} timeout")
              print("DOC_KAGGLE_PERMISSION_RESULT:",json.dumps(statuses,sort_keys=True))
              if not statuses.get("quota") or not statuses.get("private_list") or not statuses.get("private_status"):
                  raise SystemExit("DOC_KAGGLE_PERMISSION_BLOCKED: private dataset API needs attention")
              print("DOC_KAGGLE_PERMISSION_PASS: quota + own datasets + exact status")
          PY
