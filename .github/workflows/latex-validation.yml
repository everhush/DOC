name: LaTeX validation

on:
  push:
    branches:
      - submission-2026-09-30
    paths:
      - "paper-latex/**"
      - ".github/workflows/latex-validation.yml"
  pull_request:
    paths:
      - "paper-latex/**"
      - ".github/workflows/latex-validation.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             texlive-latex-base             texlive-latex-extra             texlive-fonts-recommended             lmodern             texlive-pictures             poppler-utils             qpdf

      - name: Build manuscript
        working-directory: paper-latex
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error dependency-oriented-computation.tex
          bibtex dependency-oriented-computation
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error dependency-oriented-computation.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error dependency-oriented-computation.tex

      - name: Validate manuscript
        working-directory: paper-latex
        run: |
          set -euo pipefail
          test -s dependency-oriented-computation.pdf
          qpdf --check dependency-oriented-computation.pdf

          if grep -Eq 'LaTeX Warning:.*undefined|There were undefined references|Citation .* undefined|Reference .* undefined|multiply defined|Overfull \\hbox' dependency-oriented-computation.log; then
            echo "LaTeX validation found unresolved references or layout overflow."
            grep -E 'LaTeX Warning:.*undefined|There were undefined references|Citation .* undefined|Reference .* undefined|multiply defined|Overfull \\hbox' dependency-oriented-computation.log || true
            exit 1
          fi

          pages="$(pdfinfo dependency-oriented-computation.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -le 25

          pdftotext dependency-oriented-computation.pdf manuscript.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("manuscript.txt").read_text(errors="replace")
          words = re.findall(r"\b[\w’'-]+\b", text)
          print(f"extracted_words={len(words)}")
          if len(words) > 15000:
              raise SystemExit("word-count ceiling exceeded")
          if "??" in text or "[?]" in text:
              raise SystemExit("unresolved reference marker in PDF")
          PY

          if pdffonts dependency-oriented-computation.pdf | tail -n +3 | awk 'NF && $(NF-4) != "yes" {bad=1} END {exit bad ? 0 : 1}'; then
            echo "One or more fonts are not embedded."
            exit 1
          fi

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: doc-latex-manuscript
          path: |
            paper-latex/dependency-oriented-computation.tex
            paper-latex/references.bib
            paper-latex/svjour3.cls
            paper-latex/svglov3.clo
            paper-latex/spmpsci.bst
            paper-latex/README.md
            paper-latex/dependency-oriented-computation.pdf
          if-no-files-found: error


      - name: Assemble source/reference archive
        run: |
          set -euo pipefail
          root="submission-reference"
          rm -rf "$root"
          mkdir -p "$root/manuscript-latex" "$root/manuscript-typst" "$root/runtime/results"

          cp paper-latex/dependency-oriented-computation.tex "$root/manuscript-latex/"
          cp paper-latex/references.bib "$root/manuscript-latex/"
          cp paper-latex/svjour3.cls paper-latex/svglov3.clo paper-latex/spmpsci.bst "$root/manuscript-latex/"
          cp paper-latex/README.md "$root/manuscript-latex/"

          cp paper/dependency-oriented-computation.typ paper/references.bib "$root/manuscript-typst/"

          cp runtime/CMakeLists.txt runtime/README.md "$root/runtime/"
          cp -a runtime/include runtime/src runtime/tests runtime/benchmarks runtime/examples runtime/formal runtime/scripts "$root/runtime/"
          cp runtime/results/README.md "$root/runtime/results/"
          cp -a runtime/results/independent-dedicated-100 "$root/runtime/results/"

          cat > "$root/README.md" <<'EOF'
          # DOC source and reference archive

          This archive accompanies the manuscript submission. It contains:

          - the journal-neutral LaTeX manuscript source and Springer class/style files;
          - the original Typst manuscript source;
          - the C++20 runtime, examples, benchmarks, and registered tests;
          - five bounded model checkers and the benchmark driver;
          - the authoritative 100-sample benchmark data under
            runtime/results/independent-dedicated-100/.

          The main manuscript PDF is submitted separately.

          Build the LaTeX manuscript from manuscript-latex/ with:
            pdflatex dependency-oriented-computation.tex
            bibtex dependency-oriented-computation
            pdflatex dependency-oriented-computation.tex
            pdflatex dependency-oriented-computation.tex

          Build/test the runtime from runtime/ with the CMake instructions in
          runtime/README.md. The authoritative benchmark command and machine
          record are retained with the benchmark results.
          EOF

      - name: Upload source/reference archive
        uses: actions/upload-artifact@v4
        with:
          name: doc-source-reference
          path: submission-reference/
          if-no-files-found: error
