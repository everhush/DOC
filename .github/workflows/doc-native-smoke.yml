name: DOC targeted native ABI diagnostic
on:
  push:
    branches: [ci/wayland-smoke]
    paths: ['.github/workflows/doc-native-smoke.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: ${{ github.repository_id == '1471748051' && github.ref_name == 'ci/wayland-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: doc11-self-reproduction
          path: doc11-self-evidence
          run-id: 45820438889
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: doc11-stage2-games
          path: doc11-game-evidence
          run-id: 45820438889
          github-token: ${{ github.token }}
      - name: Check prior exact artifacts and frozen reference
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:runtime-rust)" = a95a38bc6e9300aae815f83b570db5f99d32f221
          for dir in doc11-self-evidence doc11-game-evidence; do
            test "$(cat "$dir/source-sha.txt")" = 0f9b40935585a488f9b6a0b030a70d21b6f1657b
            sha256sum -c "$dir/SHA256SUMS"
          done
          chmod +x doc11-self-evidence/stage2 doc11-game-evidence/scanner2
          mkdir -p doc11-native-smoke
          git rev-parse HEAD > doc11-native-smoke/source-sha.txt
          cp doc11-self-evidence/source-sha.txt doc11-native-smoke/input-source-sha.txt
      - name: Install Clang and actual QEMU boot runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 qemu-system-x86
          clang-18 --version > doc11-native-smoke/cc-version.txt
          dpkg-query -W clang-18 qemu-system-x86 > doc11-native-smoke/packages.txt
      - name: Rebuild native compiler, verify all ABI fixtures and freestanding boot
        run: |
          set -euo pipefail
          python3 -u runtime-doc/tests/test_native_scalar.py --stage2 doc11-self-evidence/stage2 --scanner doc11-game-evidence/scanner2 --evidence doc11-native-smoke --cc clang-18 --cc-flag=-fmacro-backtrace-limit=1 --boot | tee doc11-native-smoke/test.log
      - name: Preserve exact diagnostic evidence
        if: always()
        run: |
          if test -d doc11-native-smoke; then find doc11-native-smoke -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > doc11-native-smoke/SHA256SUMS; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc11-native-smoke
          path: doc11-native-smoke/
