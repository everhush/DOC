name: DOC14 source-only release candidate
on:
  push:
    branches: [master]
    paths: ['release/**', '.github/workflows/doc14-release-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doc14-release-candidate
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository_id == '1317169134' && github.ref_name == 'master'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # observed v4
        with:
          persist-credentials: false
      - name: Export fresh text source candidate
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          python3 release/curate.py --commit "$GITHUB_SHA" --output candidate --manifest candidate-evidence/source-manifest.json
          python3 -B -c 'import sys; sys.path.insert(0, "candidate/release"); from rebuild_native import check_cpu_inputs, NATIVE; check_cpu_inputs(NATIVE)'
          tar -cf candidate-evidence/candidate.tar -C candidate .
          python3 release/verify_candidate.py --archive candidate-evidence/candidate.tar --manifest candidate-evidence/source-manifest.json --commit "$GITHUB_SHA"
          cp release/verify_candidate.py candidate-evidence/verify_candidate.py
          sha256sum candidate-evidence/candidate.tar > candidate-evidence/candidate.sha256
          git rev-parse HEAD > candidate-evidence/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed v4
        with:
          name: doc14-source-candidate
          path: candidate-evidence/
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # observed stable action revision
        with:
          toolchain: "1.100.1"
      - name: Retrieve exact previously reviewed bootstrap dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lock-input
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15249125386" > lock-input/artifact.json
          jq -e '.id == 15249125386 and .expired == false and .name == "doc14-internal-native-bootstrap" and .digest == "sha256:feccf548a5a0b5db3708f319dc7663e4f3ee08dd4cf0656887f481c51be522e7" and .workflow_run.id == 46106999905 and .workflow_run.head_sha == "2a251298e0f8bf9bdc62f51645a3441ade716531"' lock-input/artifact.json
          gh run download 46106999905 --repo "$GITHUB_REPOSITORY" --name doc14-internal-native-bootstrap --dir lock-input
          test "$(cat lock-input/source-sha.txt)" = 2a251298e0f8bf9bdc62f51645a3441ade716531
          echo 'e1b60aca7f477425698a7247d50c2575cfffe39a592ebda664e43952c400407e  lock-input/Cargo.lock' | sha256sum -c -
      - name: Internal frozen bootstrap (separate from candidate)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:runtime-rust)" = a95a38bc6e9300aae815f83b570db5f99d32f221
          mkdir -p bootstrap-evidence
          rustc -Vv > bootstrap-evidence/rustc-version.txt
          cargo -V > bootstrap-evidence/cargo-version.txt
          cp lock-input/Cargo.lock runtime-rust/Cargo.lock
          cp lock-input/artifact.json bootstrap-evidence/lock-origin.json
          cargo build --locked --no-default-features --release --manifest-path runtime-rust/Cargo.toml --bin doc-compile
          echo 'e1b60aca7f477425698a7247d50c2575cfffe39a592ebda664e43952c400407e  runtime-rust/Cargo.lock' | sha256sum -c -
          cp runtime-rust/Cargo.lock bootstrap-evidence/Cargo.lock
          cargo tree --locked --manifest-path runtime-rust/Cargo.toml --edges normal --no-default-features > bootstrap-evidence/cargo-tree.txt
          test "$(git rev-parse HEAD:runtime-rust)" = a95a38bc6e9300aae815f83b570db5f99d32f221
          git diff --exit-code -- runtime-rust
          for stage in managed module_scan; do
            runtime-rust/target/release/doc-compile "runtime-doc/compiler/$stage.doc" --emit-c "bootstrap-evidence/$stage.c" --emit-ir "bootstrap-evidence/$stage.ir" --out "bootstrap-evidence/$stage"
            readelf -d "bootstrap-evidence/$stage" > "bootstrap-evidence/$stage-linkage.txt"
          done
          cd bootstrap-evidence
          git rev-parse HEAD > source-sha.txt
          cc --version > cc-version.txt
          sha256sum managed module_scan Cargo.lock rustc-version.txt cargo-version.txt cargo-tree.txt source-sha.txt cc-version.txt managed-linkage.txt module_scan-linkage.txt lock-origin.json > SHA256SUMS
      - name: Attest exact source and native bootstrap build inputs
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            candidate-evidence/candidate.tar
            candidate-evidence/source-manifest.json
            candidate-evidence/verify_candidate.py
            bootstrap-evidence/managed
            bootstrap-evidence/module_scan
            bootstrap-evidence/SHA256SUMS
      - name: Preserve signed provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir provenance-evidence
          test -s "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" provenance-evidence/attestation.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed v4
        with:
          name: doc14-build-provenance
          path: provenance-evidence/attestation.jsonl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed v4
        with:
          name: doc14-internal-native-bootstrap
          path: |
            bootstrap-evidence/managed
            bootstrap-evidence/module_scan
            bootstrap-evidence/SHA256SUMS
            bootstrap-evidence/*-linkage.txt
            bootstrap-evidence/source-sha.txt
            bootstrap-evidence/cc-version.txt
            bootstrap-evidence/Cargo.lock
            bootstrap-evidence/rustc-version.txt
            bootstrap-evidence/cargo-version.txt
            bootstrap-evidence/cargo-tree.txt
            bootstrap-evidence/lock-origin.json
  clean-cpu:
    needs: stage
    permissions:
      contents: read
      attestations: read
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # resolved v4
        with:
          name: doc14-source-candidate
          path: candidate-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # resolved v4
        with:
          name: doc14-internal-native-bootstrap
          path: bootstrap-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # resolved v4
        with:
          name: doc14-build-provenance
          path: provenance-evidence
      - name: Verify signed source and bootstrap subjects before executing downloaded code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clean-evidence/provenance
          gh --version > clean-evidence/provenance/gh-version.txt
          for subject in candidate-evidence/candidate.tar candidate-evidence/source-manifest.json candidate-evidence/verify_candidate.py bootstrap-evidence/managed bootstrap-evidence/module_scan bootstrap-evidence/SHA256SUMS; do
            gh attestation verify "$subject" --bundle provenance-evidence/attestation.jsonl --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/master --source-digest "$GITHUB_SHA" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/doc14-release-candidate.yml" --deny-self-hosted-runners --format json > "clean-evidence/provenance/$(basename "$subject").json"
          done
          cp provenance-evidence/attestation.jsonl clean-evidence/provenance/
      - name: Verify and rebuild without development checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat candidate-evidence/source-sha.txt)" = "$GITHUB_SHA"
          test "$(cat bootstrap-evidence/source-sha.txt)" = "$GITHUB_SHA"
          sha256sum -c candidate-evidence/candidate.sha256
          (cd bootstrap-evidence && sha256sum -c SHA256SUMS && chmod +x managed module_scan)
          mkdir -p clean-evidence
          python3 candidate-evidence/verify_candidate.py --archive candidate-evidence/candidate.tar --manifest candidate-evidence/source-manifest.json --commit "$GITHUB_SHA" --output clean | tee clean-evidence/manifest-verification.log
          test ! -e clean/runtime-rust
          test ! -e clean/runtime-goose
          python3 -u clean/release/rebuild_native.py --bootstrap bootstrap-evidence/managed --bootstrap-sha256 "$(awk '$2=="managed"{print $1}' bootstrap-evidence/SHA256SUMS)" --scanner bootstrap-evidence/module_scan --scanner-sha256 "$(awk '$2=="module_scan"{print $1}' bootstrap-evidence/SHA256SUMS)" --evidence clean-evidence 2>&1 | tee clean-evidence/rebuild.log
          git --version > clean-evidence/git-version.txt
          cc --version > clean-evidence/cc-version.txt
          find clean-evidence -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > clean-evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed v4
        if: always()
        with:
          name: doc14-clean-cpu-evidence
          path: clean-evidence/
      - name: Build physical candidate fixture without opening a device
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/gfx-rs/wgpu-native/releases/download/v27.0.4.1/wgpu-linux-x86_64-release.zip -o wgpu.zip
          echo '9385b8a9e4e6f0b00264757577511097104fedf6db7819aa3e34a106c3dc0a42  wgpu.zip' | sha256sum -c -
          unzip -q wgpu.zip -d wgpu
          sha256sum -c clean-evidence/SHA256SUMS
          python3 -u clean/release/physical_gpu.py --stage2 clean-evidence/self/stage2 --scanner clean-evidence/scanner2 --reactive clean-evidence/reactive2 --wgpu wgpu --commit "$GITHUB_SHA" --output gpu-build
          cc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -I clean/runtime-doc/runtime clean/runtime-doc/tests/webgpu_loss_evidence_test.c -o gpu-build/loss-evidence-test
          gpu-build/loss-evidence-test | tee gpu-build/loss-evidence-test.log
          python3 -u clean/runtime-doc/tests/test_gpu.py --build-only --reactive clean-evidence/reactive2 --gpu-plan gpu-build/gpu_plan2 --wgpu-root wgpu --stream --artifacts gpu-build/micro | tee gpu-build/micro-build.log
          python3 -u clean/runtime-doc/tests/build_autonomous_scale.py --reactive clean-evidence/reactive2 --planner gpu-build/gpu_plan2 --wgpu wgpu --out gpu-build/scale
          sha256sum wgpu.zip > gpu-build/wgpu-archive-sha256.txt
          find gpu-build -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > gpu-build/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed v4
        if: always()
        with:
          name: doc14-gpu-build
          path: gpu-build/
  physical:
    needs: clean-cpu
    if: github.repository_id == '1317169134' && github.ref_name == 'master'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # observed v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # resolved v4
        with:
          name: doc14-gpu-build
          path: gpu-build
      - name: Verify same-run build and install existing private dispatcher dependency
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum -c gpu-build/SHA256SUMS
          python3 -m pip install 'kaggle>=2.2.1,<3' 'six>=1.16'
          mkdir -p physical-dependencies
          python3 -m pip freeze > physical-dependencies/pip-freeze.txt
      - name: Execute and independently verify exact physical T4 fixture and scaling
        env:
          KAGGLE_DOC_1: ${{ secrets.KAGGLE_DOC_1 }}
          DOC_KAGGLE_USERNAME: ${{ vars.DOC_KAGGLE_USERNAME }}
        run: python3 -u ci/kaggle/doc14_candidate_dispatch.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed v4
        if: always()
        with:
          name: doc14-physical-smoke
          path: |
            physical-evidence/
            physical-dependencies/
