name: DOC targeted Wayland validation
on:
  push:
    branches: [ci/wayland-smoke]
    paths: ['.github/workflows/doc-wayland-smoke.yml', 'runtime-doc/runtime/scene_wayland.*', 'runtime-doc/tests/test_scene_wayland.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: doc11-wayland-smoke-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  wayland:
    if: ${{ github.repository_id == '1471748051' && github.ref_name == 'ci/wayland-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: doc11-stage2-games
          path: doc11-game-evidence
          run-id: 45820438889
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: doc11-stage2-mesh-plan
          path: doc11-mesh-evidence
          run-id: 45820438889
          github-token: ${{ github.token }}
      - name: Verify older source-bound inputs; no final acceptance claim
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:runtime-rust)" = a95a38bc6e9300aae815f83b570db5f99d32f221
          test "$(cat doc11-game-evidence/source-sha.txt)" = 0f9b40935585a488f9b6a0b030a70d21b6f1657b
          test "$(cat doc11-mesh-evidence/source-sha.txt)" = 0f9b40935585a488f9b6a0b030a70d21b6f1657b
          sha256sum -c doc11-game-evidence/SHA256SUMS
          sha256sum -c doc11-mesh-evidence/SHA256SUMS
          sha256sum -c doc11-mesh-evidence/render-SHA256SUMS
          chmod +x doc11-game-evidence/{scanner2,gpu_plan2}
          mkdir -p doc11-wayland-smoke
          git rev-parse HEAD > doc11-wayland-smoke/source-sha.txt
          cp doc11-game-evidence/source-sha.txt doc11-wayland-smoke/input-source-sha.txt
      - name: Install actual Wayland, compositor and pinned WebGPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 mesa-vulkan-drivers libvulkan1 weston libwayland-dev wayland-protocols libxkbcommon-dev xvfb xauth xdotool
          mkdir -p doc11-wgpu
          curl -fL --retry 3 https://github.com/gfx-rs/wgpu-native/releases/download/v27.0.4.1/wgpu-linux-x86_64-release.zip -o doc11-wgpu.zip
          echo '9385b8a9e4e6f0b00264757577511097104fedf6db7819aa3e34a106c3dc0a42  doc11-wgpu.zip' | sha256sum -c -
          unzip -q doc11-wgpu.zip -d doc11-wgpu
          dpkg-query -W weston libwayland-dev wayland-protocols libxkbcommon-dev clang-18 > doc11-wayland-smoke/packages.txt
      - name: Actual native Wayland replay and compositor-forwarded input
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1024x768x24' python3 -u runtime-doc/tests/test_scene_wayland.py --games doc11-game-evidence --render doc11-mesh-evidence/render --wgpu-root doc11-wgpu --evidence doc11-wayland-smoke/wayland | tee doc11-wayland-smoke/test.log
      - name: Manifest even on failure
        if: always()
        run: |
          if test -d doc11-wayland-smoke; then
            find doc11-wayland-smoke -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > doc11-wayland-smoke/SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc11-wayland-smoke
          path: doc11-wayland-smoke/
