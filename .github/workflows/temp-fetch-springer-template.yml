name: Fetch Springer submission template

on:
  push:
    branches:
      - submission-latex-2026-10-02

permissions:
  contents: read

jobs:
  fetch-template:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Springer Nature template
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3             'https://cms-resources.apps.public.k8s.springernature.io/springer-cms/rest/v1/content/18782940/data/v12'             --output springer-template.zip
          mkdir template
          unzip -q springer-template.zip -d template
      - name: Download Computing svjour3 files
        run: |
          set -euxo pipefail
          mkdir computing-template
          base='https://raw.githubusercontent.com/scottkosty/install-tl-ubuntu/d645e1ea3e730f65b0fc006dced43dc5558510a3/archive/Springer'
          curl --fail --location --retry 3 "$base/svjour3.cls" -o computing-template/svjour3.cls
          curl --fail --location --retry 3 "$base/svglov3.clo" -o computing-template/svglov3.clo
          curl --fail --location --retry 3 "$base/spbasic.bst" -o computing-template/spbasic.bst
          grep -q 'smallextended' computing-template/svjour3.cls
      - name: Upload generic Springer Nature template
        uses: actions/upload-artifact@v7
        with:
          name: springer-template
          path: template/
          if-no-files-found: error
          retention-days: 1
      - name: Upload Computing svjour3 template
        uses: actions/upload-artifact@v7
        with:
          name: computing-svjour3-template
          path: computing-template/
          if-no-files-found: error
          retention-days: 1
