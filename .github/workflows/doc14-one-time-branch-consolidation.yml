name: One-time DOC branch consolidation
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/doc14-one-time-branch-consolidation.yml'
permissions:
  contents: write
jobs:
  delete-consolidated-refs:
    if: github.repository_id == '1317169134' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all exact refs and ancestry, then atomically delete only consolidated branches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '158817741a446b0029aa6aef3747e8609614e726'
          cat > /tmp/doc-expected-refs <<'EOF'
          93b6bc799b6c16c5b63a0ff3beb3a3d0dadad541 refs/heads/doc14-manuscript-review
          4f6373719e3c846c4d9a59738b3f13562515fa13 refs/heads/imported-development-2026-11-25
          c10dfcd31f3f3b7f7235d7abc912c98b39174a46 refs/heads/imported-development-baseline-2026-11-25
          da738c15eb89f366f120273c25c47954307893cd refs/heads/journal-neutral-latex-2026-10-02
          da738c15eb89f366f120273c25c47954307893cd refs/heads/post-submission-scaling-2026-10-01
          03f690adeeca581abeead07e9046e7686f0f71e2 refs/heads/private-migration-staging
          3f5552f321748b1b7559a3f1827564d876e5dde5 refs/heads/reviewer-revision-2026-09-29
          856bb34a03621190bac610d54f2094115ca50a30 refs/heads/runtime-parallel-optimization-2026-09-30
          f4ec5156a9658f43d517b0ec4442e44f68e9b9c1 refs/heads/scaling-scheduler-opt-2026-10-01
          2bdff3bac0b7f794be4d451f1344628f070bfb36 refs/heads/scaling-validation-2026-10-01
          1e295c19fc3ff40fe45931c6fc6fb412854308ee refs/heads/snapshot-2026-11-17-pre-rust-runtime
          3d9b8ed7ec5e54d2cbc566e58e657f2d88154008 refs/heads/snapshot-master-2026-10-03-0839-ist
          71ab709dd6a8949e3711ab6a320c0eb45da77f93 refs/heads/snapshot-master-2026-10-03-0903-ist
          27e3024bb4f1cf677ae6616f32fe958a1bf33031 refs/heads/snapshot-master-before-private-consolidation-2026-11-25
          27e3024bb4f1cf677ae6616f32fe958a1bf33031 refs/heads/snapshot-master-before-private-migration-2026-11-25
          d2624e5b7b665e91bade5084d37df40a03f139cc refs/heads/snapshot-pre-neutral-layout-2026-10-03-0856-ist
          d2624e5b7b665e91bade5084d37df40a03f139cc refs/heads/submission-2026-09-30
          b574224013185c2a620c77509313cec88ee7dfd2 refs/heads/submission-latex-2026-10-02
          ed6243b1da207b9623ef9aaa7cf7b39ccd7e9973 refs/heads/validation/wayland-source
          EOF
          printf '%s refs/heads/master\n' "$GITHUB_SHA" >> /tmp/doc-expected-refs
          git ls-remote --heads origin | awk '{print $1 " " $2}' | LC_ALL=C sort > /tmp/doc-actual-refs
          LC_ALL=C sort /tmp/doc-expected-refs > /tmp/doc-expected-sorted
          diff -u /tmp/doc-expected-sorted /tmp/doc-actual-refs
          leases=()
          deletions=()
          while read -r sha ref; do
            if [[ "$ref" == refs/heads/master ]]; then continue; fi
            [[ "$ref" == refs/heads/* ]]
            git merge-base --is-ancestor "$sha" HEAD
            leases+=("--force-with-lease=$ref:$sha")
            deletions+=(":$ref")
            printf 'Verified ancestor %s %s\n' "$sha" "$ref"
          done < /tmp/doc-expected-refs
          test "${#deletions[@]}" = 19
          git push --atomic "${leases[@]}" origin "${deletions[@]}"
          git ls-remote --heads origin | awk '{print $1 " " $2}' > /tmp/doc-final-refs
          printf '%s refs/heads/master\n' "$GITHUB_SHA" | diff -u - /tmp/doc-final-refs
          echo DOC_BRANCH_CONSOLIDATION_PASS
