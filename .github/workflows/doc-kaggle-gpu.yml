name: DOC Kaggle physical GPU parity (quota gated)

# Kaggle owns GPU quota, accelerator availability and session duration.
# No DOC-specific usage, repeat, concurrency or session-time restrictions.
# The regular workflow retains CPU behavior and Mesa software Vulkan checks.
on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Kaggle-supported GPU name (default NVIDIA T4)
        type: string
        required: true
        default: NvidiaTeslaT4
  workflow_run:
    workflows: ['DOC dual-runtime validation']
    types: [completed]
    branches: [feat/webgpu-dual-runtime-ci]

permissions:
  contents: read
  actions: read

jobs:
  physical-doc-parity:
    name: Kaggle Rust wgpu vs Goose SDL3 physical GPU
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         github.ref_name == 'feat/webgpu-dual-runtime-ci') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'feat/webgpu-dual-runtime-ci')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact trusted DOC revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-GPU quota, credential and evidence unit tests
        run: python3 -m unittest discover -s ci/kaggle -p 'test_*.py' -v
      - name: Install official Kaggle CLI
        run: python3 -m pip install --disable-pip-version-check 'kaggle>=2.2.1,<3' 'six>=1.16'
      - name: Check actual Kaggle quota, submit private notebook and verify physical GPUs
        env:
          # Secret stays in the GHA dispatcher, never in Kaggle notebook code.
          KAGGLE_DOC_1: ${{ secrets.KAGGLE_DOC_1 }}
          GITHUB_TOKEN: ${{ github.token }}
          DOC_KAGGLE_USERNAME: ${{ vars.DOC_KAGGLE_USERNAME }}
          DOC_TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          DOC_SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          DOC_KAGGLE_ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          set -euo pipefail
          python3 ci/kaggle/dispatch.py \
            --accelerator "$DOC_KAGGLE_ACCELERATOR" \
            --output kaggle-validation
      - name: Retain non-secret quota, Vulkan, Goose, Rust and GPU parity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-kaggle-physical-gpu-${{ github.run_id }}
          path: kaggle-validation/
          retention-days: 14
          if-no-files-found: warn
