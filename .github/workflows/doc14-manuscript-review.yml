name: DOC14 manuscript review
on:
  push:
    branches: [master]
    paths: ['preprint-model/**', 'preprint-calculus/**', '.github/workflows/doc14-manuscript-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    if: github.repository_id == '1317169134' && github.ref_name == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install manuscript tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-linuxlibertine
          curl -fsSL --retry 3 https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - name: Render both Typst preprints
        run: |
          set -euo pipefail
          mkdir -p manuscript-output
          git rev-parse HEAD > manuscript-output/source-sha.txt
          typst compile --root . preprint-model/dependency-oriented-computation.typ manuscript-output/preprint-model.pdf 2> manuscript-output/preprint.log
          typst compile --root . preprint-calculus/dependency-oriented-calculus.typ manuscript-output/preprint-calculus.pdf 2> manuscript-output/calculus.log
          for pdf in manuscript-output/*.pdf; do
            pdfinfo "$pdf" > "$pdf.info"
            pdffonts "$pdf" > "$pdf.fonts"
            pdftotext "$pdf" "$pdf.txt"
          done
          grep -E 'Pages:|File size:' manuscript-output/*.info
          if grep -Ei 'undefined references|citation.*undefined|there were undefined' manuscript-output/*.log; then exit 1; fi
          for pdf in manuscript-output/*.pdf; do
            if grep -Eiq '(^|[^[:alnum:]_])(HVM2?|Bend)([^[:alnum:]_]|$)' "$pdf.txt"; then exit 1; fi
          done
          echo 'Typst preprints only; previous Computing page-limit review is historical, not submission approval.' > manuscript-output/venue-review.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc14-manuscript-render
          path: manuscript-output/
